<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xadrez Arcade Escolar</title>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="theme-color" content="#1e1e24">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }
        body { background: #1e1e24; color: #fff; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 10px; }
        .container { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 12px; }
        h1 { text-align: center; font-size: 1.5rem; color: #ffd700; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .panel { background: #2a2a35; border-radius: 12px; padding: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 1px solid #3a3a4a; }
        .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
        select, button, input[type="text"] { width: 100%; padding: 10px; border-radius: 6px; border: none; background: #3e3e56; color: white; font-weight: bold; font-size: 0.9rem; }
        input[type="text"] { background: #15151c; border: 1px solid #555; text-align: center; letter-spacing: 1px; text-transform: uppercase; }
        button { cursor: pointer; transition: background 0.2s; }
        button.btn-primary { background: #27ae60; grid-column: span 2; }
        button.btn-primary:hover { background: #2ecc71; }
        button.btn-online { background: #2980b9; }
        button.btn-online:hover { background: #3498db; }
        
        /* Painel Online */
        .online-box { display: none; background: #20202a; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #2980b9; flex-direction: column; gap: 8px; }
        .online-row { display: flex; gap: 6px; align-items: center; }
        .code-display { background: #15151c; padding: 8px; border-radius: 6px; font-family: monospace; color: #ffd700; font-size: 1.1rem; text-align: center; flex: 1; border: 1px dashed #ffd700; }

        .toggle-container { display: flex; justify-content: space-between; align-items: center; padding: 6px 4px; background: #343444; border-radius: 6px; margin-top: 6px; font-size: 0.85rem; }
        .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .3s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #27ae60; }
        input:checked + .slider:before { transform: translateX(20px); }

        .status-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 4px; font-size: 0.95rem; font-weight: bold; background: #20202a; padding: 8px 12px; border-radius: 6px; border-left: 4px solid #ffd700; }
        .timers { display: flex; justify-content: space-between; gap: 10px; }
        .timer-box { flex: 1; padding: 8px; border-radius: 6px; text-align: center; font-family: monospace; font-size: 1.2rem; font-weight: bold; background: #15151c; border: 1px solid #333; }
        .timer-box.white-turn { border-color: #fff; box-shadow: 0 0 8px rgba(255,255,255,0.3); }
        .timer-box.black-turn { border-color: #ffd700; box-shadow: 0 0 8px rgba(255,215,0,0.3); }
        .timer-label { font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; margin-bottom: 2px; }

        .board-wrapper { width: 100%; aspect-ratio: 1 / 1; background: #2a2a35; padding: 4px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); border: 2px solid #3a3a4a; }
        .board { display: grid; grid-template-columns: repeat(8, 1fr); grid-template-rows: repeat(8, 1fr); width: 100%; height: 100%; border-radius: 8px; overflow: hidden; }
        .square { display: flex; align-items: center; justify-content: center; position: relative; cursor: pointer; aspect-ratio: 1 / 1; width: 100%; height: 100%; overflow: hidden; }
        .square.light { background-color: #eadeca; color: #4a3319; }
        .square.dark { background-color: #7a583a; color: #fff; }
        .piece { font-size: min(7.5vw, 34px); line-height: 1; display: flex; align-items: center; justify-content: center; width: 85%; height: 85%; transition: transform 0.15s ease; z-index: 2; }
        .selected { background-color: #baca44 !important; }
        .hint-dot { position: absolute; width: 28%; height: 28%; background-color: rgba(0, 0, 0, 0.22); border-radius: 50%; z-index: 3; pointer-events: none; }
        .square.dark .hint-dot { background-color: rgba(255, 255, 255, 0.28); }
        .hint-capture { position: absolute; width: 80%; height: 80%; border: 4px solid rgba(214, 48, 49, 0.6); border-radius: 50%; z-index: 3; pointer-events: none; }
        .score-bar { display: flex; justify-content: space-between; font-size: 0.8rem; background: #20202a; padding: 6px 12px; border-radius: 6px; opacity: 0.9; }
    </style>
</head>
<body>

<div class="container">
    <h1>♟️ Xadrez Arcade</h1>

    <div class="panel">
        <div class="controls">
            <div>
                <label style="font-size:0.75rem; opacity:0.7;">MODO DE JOGO</label>
                <select id="gameMode">
                    <option value="human">Mesmo Celular</option>
                    <option value="cpu">Contra Máquina</option>
                    <option value="online">Online (Convite)</option>
                </select>
            </div>
            <div>
                <label style="font-size:0.75rem; opacity:0.7;">TEMPO INICIAL</label>
                <select id="timeControl">
                    <option value="300">5 Minutos</option>
                    <option value="600" selected>10 Minutos</option>
                    <option value="900">15 Minutos</option>
                </select>
            </div>
        </div>

        <!-- Área de Conexão Online -->
        <div class="online-box" id="onlineBox">
            <div style="font-size: 0.8rem; color: #3498db; font-weight: bold;">1. Envie seu código para o colega (Você = Brancas):</div>
            <div class="online-row">
                <div class="code-display" id="myPeerId">Gerando...</div>
                <button class="btn-online" style="width: auto; padding: 8px 12px;" onclick="copyCode()">Copiar</button>
            </div>
            <div style="font-size: 0.8rem; color: #e67e22; font-weight: bold; margin-top: 4px;">2. Ou cole o código do colega (Você = Pretas):</div>
            <div class="online-row">
                <input type="text" id="friendIdInput" placeholder="Ex: XAD-9A2B">
                <button class="btn-online" style="width: auto; padding: 8px 12px;" onclick="connectToFriend()">Entrar</button>
            </div>
        </div>

        <div class="controls">
            <div class="toggle-container">
                <span>Mostrar Dicas</span>
                <label class="switch"><input type="checkbox" id="toggleHints" checked><span class="slider"></span></label>
            </div>
            <div class="toggle-container">
                <span>Música de Fundo</span>
                <label class="switch"><input type="checkbox" id="toggleMusic"><span class="slider"></span></label>
            </div>
            <button class="btn-primary" id="restartBtn">▶️ Iniciar / Reiniciar Partida</button>
        </div>

        <div class="timers">
            <div class="timer-box" id="whiteTimerBox">
                <div class="timer-label" id="whiteLabel">Brancas</div>
                <span id="whiteTime">10:00</span>
            </div>
            <div class="timer-box" id="blackTimerBox">
                <div class="timer-label" id="blackLabel">Pretas</div>
                <span id="blackTime">10:00</span>
            </div>
        </div>

        <div class="status-bar" id="statusMessage">Escolha o modo e aperte Iniciar!</div>
    </div>

    <div class="board-wrapper"><div class="board" id="board"></div></div>

    <div class="score-bar">
        <span id="whiteScore">Vantagem Brancas: +0</span>
        <span id="blackScore">Vantagem Pretas: +0</span>
    </div>
</div>

<script>
    let boardState = [], turn = 'w', selectedSquare = null, validMoves = [];
    let gameActive = false, gameMode = 'human', hintsEnabled = true;
    let whiteTimeLeft = 600, blackTimeLeft = 600, timerInterval = null;

    // Variáveis Multiplayer Online (PeerJS com servidores STUN do Google)
    let peer = null, conn = null, myOnlineColor = null;

    const boardEl = document.getElementById('board');
    const statusMsg = document.getElementById('statusMessage');
    const whiteTimeEl = document.getElementById('whiteTime'), blackTimeEl = document.getElementById('blackTime');
    const whiteTimerBox = document.getElementById('whiteTimerBox'), blackTimerBox = document.getElementById('blackTimerBox');
    const gameModeSelect = document.getElementById('gameMode'), timeControlSelect = document.getElementById('timeControl');
    const toggleHintsInput = document.getElementById('toggleHints'), toggleMusicInput = document.getElementById('toggleMusic');
    const restartBtn = document.getElementById('restartBtn'), onlineBox = document.getElementById('onlineBox');
    const whiteLabel = document.getElementById('whiteLabel'), blackLabel = document.getElementById('blackLabel');
    const whiteScoreEl = document.getElementById('whiteScore'), blackScoreEl = document.getElementById('blackScore');

    const piecesSymbols = { 'r': '♜', 'n': '♞', 'b': '♝', 'q': '♛', 'k': '♚', 'p': '♟', 'R': '♖', 'N': '♘', 'B': '♗', 'Q': '♕', 'K': '♔', 'P': '♙' };
    const pieceValues = { 'p': 1, 'n': 3, 'b': 3, 'r': 5, 'q': 9, 'k': 0, 'P': 1, 'N': 3, 'B': 3, 'R': 5, 'Q': 9, 'K': 0 };

    function initOnlinePeer() {
        if (peer && !peer.destroyed) return;
        const shortId = 'XAD-' + Math.random().toString(36).substring(2, 6).toUpperCase();
        document.getElementById('myPeerId').textContent = "Gerando...";
        statusMsg.textContent = "Conectando ao servidor online...";

        peer = new Peer(shortId, {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' }
                ]
            }
        });

        peer.on('open', (id) => {
            document.getElementById('myPeerId').textContent = id;
            statusMsg.textContent = "Sala pronta! Envie o código ou cole o do colega.";
        });

        peer.on('error', (err) => {
            statusMsg.textContent = "Erro na sala (" + err.type + "). Tente novamente.";
        });

        // Quando o colega entra na sua sala (Você = Brancas)
        peer.on('connection', (connection) => {
            conn = connection;
            myOnlineColor = 'w';
            statusMsg.textContent = "Colega conectando...";
            setupConnectionHandlers();
        });
    }

    // Quando você entra na sala do colega (Você = Pretas)
    function connectToFriend() {
        const friendId = document.getElementById('friendIdInput').value.trim().toUpperCase();
        if (!friendId) {
            statusMsg.textContent = "Digite o código do colega primeiro!";
            return;
        }
        if (!peer || peer.disconnected) {
            initOnlinePeer();
            setTimeout(() => connectToFriend(), 1500);
            return;
        }
        statusMsg.textContent = "Entrando na sala " + friendId + "...";
        conn = peer.connect(friendId, { reliable: true });
        myOnlineColor = 'b';
        setupConnectionHandlers();
    }

    function setupConnectionHandlers() {
        conn.on('open', () => {
            if (myOnlineColor === 'b') {
                statusMsg.textContent = "Conectado! Iniciando partida...";
                conn.send({ type: 'ready' });
            } else {
                statusMsg.textContent = "Colega entrou! Você é as Brancas.";
                startNewGame(true);
            }
        });

        conn.on('data', (data) => {
            if (data.type === 'ready') {
                startNewGame(true);
            } else if (data.type === 'start') {
                timeControlSelect.value = data.time;
                startNewGame(false);
            } else if (data.type === 'move') {
                executeMove(data.fromR, data.fromC, data.toR, data.toC, true);
            }
        });

        conn.on('close', () => {
            statusMsg.textContent = "O colega desconectou da sala.";
            gameActive = false;
        });

        conn.on('error', (err) => {
            statusMsg.textContent = "Falha na conexão com o colega.";
        });
    }

    function copyCode() {
        const code = document.getElementById('myPeerId').textContent;
        if (code.includes('XAD-')) {
            navigator.clipboard.writeText(code);
            alert("Código copiado: " + code + "\nEnvie no WhatsApp para seu colega!");
        }
    }

    gameModeSelect.addEventListener('change', () => {
        if (gameModeSelect.value === 'online') {
            onlineBox.style.display = 'flex';
            initOnlinePeer();
        } else {
            onlineBox.style.display = 'none';
        }
    });

    // Áudio Sintetizado
    let audioCtx = null, musicOsc = null, musicGain = null;
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playMoveSound() {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'sine'; osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } catch(e){}
    }
    function playCaptureSound() {
        if (!audioCtx) return;
        try {
            let osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.type = 'triangle'; osc.frequency.setValueAtTime(180, audioCtx.currentTime);
            osc.frequency.linearRampToValueAtTime(60, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime); gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            osc.start(); osc.stop(audioCtx.currentTime + 0.15);
        } catch(e){}
    }
    function startBackgroundMusic() {
        initAudio();
        if (!toggleMusicInput.checked || !gameActive) return;
        try {
            if (musicOsc) stopBackgroundMusic();
            musicOsc = audioCtx.createOscillator(); musicGain = audioCtx.createGain();
            musicOsc.connect(musicGain); musicGain.connect(audioCtx.destination);
            musicOsc.type = 'triangle'; musicOsc.frequency.setValueAtTime(110, audioCtx.currentTime);
            musicGain.gain.setValueAtTime(0.03, audioCtx.currentTime); musicOsc.start();
        } catch(e){}
    }
    function stopBackgroundMusic() {
        try { if (musicOsc) { musicOsc.stop(); musicOsc.disconnect(); musicOsc = null; } } catch(e){}
    }

    const initialPosition = [
        ['r', 'n', 'b', 'q', 'k', 'b', 'n', 'r'],
        ['p', 'p', 'p', 'p', 'p', 'p', 'p', 'p'],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['', '', '', '', '', '', '', ''],
        ['P', 'P', 'P', 'P', 'P', 'P', 'P', 'P'],
        ['R', 'N', 'B', 'Q', 'K', 'B', 'N', 'R']
    ];

    function createBoardDOM() {
        boardEl.innerHTML = '';
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const square = document.createElement('div');
                square.classList.add('square', (r + c) % 2 === 0 ? 'light' : 'dark');
                square.addEventListener('click', () => onSquareClick(r, c));
                boardEl.appendChild(square);
            }
        }
    }

    function updateBoardDisplay() {
        const squares = boardEl.children;
        let whiteMaterial = 0, blackMaterial = 0;

        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const squareEl = squares[r * 8 + c];
                const piece = boardState[r][c];
                squareEl.innerHTML = '';
                squareEl.classList.remove('selected');

                if (piece) {
                    const pieceEl = document.createElement('div');
                    pieceEl.classList.add('piece');
                    pieceEl.textContent = piecesSymbols[piece];
                    pieceEl.style.color = (piece === piece.toUpperCase()) ? '#ffffff' : '#111111';
                    pieceEl.style.textShadow = (piece === piece.toUpperCase()) ? '0 0 3px #000, 0 1px 2px #000' : '0 0 2px #fff';
                    squareEl.appendChild(pieceEl);

                    if (piece === piece.toUpperCase()) whiteMaterial += pieceValues[piece];
                    else blackMaterial += pieceValues[piece];
                }

                if (hintsEnabled && selectedSquare && validMoves.some(m => m.r === r && m.col === c)) {
                    const hint = document.createElement('div');
                    hint.classList.add(piece ? 'hint-capture' : 'hint-dot');
                    squareEl.appendChild(hint);
                }
            }
        }

        if (selectedSquare) squares[selectedSquare.r * 8 + selectedSquare.c].classList.add('selected');

        let diff = whiteMaterial - blackMaterial;
        whiteScoreEl.textContent = `Vantagem Brancas: +${diff > 0 ? diff : 0}`;
        blackScoreEl.textContent = `Vantagem Pretas: +${diff < 0 ? Math.abs(diff) : 0}`;
    }

    function getLegalMoves(r, c) {
        const piece = boardState[r][c];
        if (!piece) return [];
        const isWhite = piece === piece.toUpperCase();
        const moves = [];
        const straightDirs = [[-1, 0], [1, 0], [0, -1], [0, 1]];
        const diagDirs = [[-1, -1], [-1, 1], [1, -1], [1, 1]];
        const allDirs = straightDirs.concat(diagDirs);

        function addSlideMoves(dirs) {
            for (let d of dirs) {
                let nr = r + d[0], nc = c + d[1];
                while (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                    const target = boardState[nr][nc];
                    if (!target) moves.push({r: nr, col: nc});
                    else {
                        if (isWhite !== (target === target.toUpperCase())) moves.push({r: nr, col: nc});
                        break;
                    }
                    nr += d[0]; nc += d[1];
                }
            }
        }

        const type = piece.toLowerCase();
        if (type === 'p') {
            const dir = isWhite ? -1 : 1, startRow = isWhite ? 6 : 1;
            if (r + dir >= 0 && r + dir < 8 && !boardState[r + dir][c]) {
                moves.push({r: r + dir, col: c});
                if (r === startRow && !boardState[r + 2 * dir][c]) moves.push({r: r + 2 * dir, col: c});
            }
            for (let dc of [-1, 1]) {
                let nr = r + dir, nc = c + dc;
                if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8 && boardState[nr][nc]) {
                    if (isWhite !== (boardState[nr][nc] === boardState[nr][nc].toUpperCase())) moves.push({r: nr, col: nc});
                }
            }
        } else if (type === 'n') {
            for (let m of [[-2, -1], [-2, 1], [-1, -2], [-1, 2], [1, -2], [1, 2], [2, -1], [2, 1]]) {
                let nr = r + m[0], nc = c + m[1];
                if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                    const target = boardState[nr][nc];
                    if (!target || isWhite !== (target === target.toUpperCase())) moves.push({r: nr, col: nc});
                }
            }
        } else if (type === 'b') addSlideMoves(diagDirs);
        else if (type === 'r') addSlideMoves(straightDirs);
        else if (type === 'q') addSlideMoves(allDirs);
        else if (type === 'k') {
            for (let d of allDirs) {
                let nr = r + d[0], nc = c + d[1];
                if (nr >= 0 && nr < 8 && nc >= 0 && nc < 8) {
                    const target = boardState[nr][nc];
                    if (!target || isWhite !== (target === target.toUpperCase())) moves.push({r: nr, col: nc});
                }
            }
        }
        return moves;
    }

    function onSquareClick(r, c) {
        if (!gameActive) return;
        initAudio();

        if (gameMode === 'cpu' && turn === 'b') return;
        if (gameMode === 'online' && turn !== myOnlineColor) return;

        const piece = boardState[r][c];
        const isPieceWhite = piece ? (piece === piece.toUpperCase()) : null;

        if (piece && ((turn === 'w' && isPieceWhite) || (turn === 'b' && isPieceWhite === false))) {
            selectedSquare = {r, c};
            validMoves = getLegalMoves(r, c);
            updateBoardDisplay();
            return;
        }

        if (selectedSquare) {
            if (validMoves.some(m => m.r === r && m.col === c)) {
                executeMove(selectedSquare.r, selectedSquare.c, r, c, false);
            } else {
                selectedSquare = null; validMoves = []; updateBoardDisplay();
            }
        }
    }

    function executeMove(fromR, fromC, toR, toC, isRemote) {
        const movingPiece = boardState[fromR][fromC];
        const targetPiece = boardState[toR][toC];

        targetPiece ? playCaptureSound() : playMoveSound();

        boardState[toR][toC] = movingPiece;
        boardState[fromR][fromC] = '';

        if (movingPiece.toLowerCase() === 'p' && (toR === 0 || toR === 7)) {
            boardState[toR][toC] = (movingPiece === 'P') ? 'Q' : 'q';
        }

        if (gameMode === 'online' && !isRemote && conn && conn.open) {
            conn.send({ type: 'move', fromR, fromC, toR, toC });
        }

        if (targetPiece && targetPiece.toLowerCase() === 'k') {
            endGame(movingPiece === movingPiece.toUpperCase() ? 'Brancas venceram!' : 'Pretas venceram!');
            return;
        }

        selectedSquare = null; validMoves = [];
        turn = (turn === 'w') ? 'b' : 'w';
        updateTurnVisuals();
        updateBoardDisplay();

        if (gameActive && gameMode === 'cpu' && turn === 'b') {
            setTimeout(executeCpuMove, 400);
        }
    }

    function executeCpuMove() {
        if (!gameActive) return;
        let allCpuMoves = [];
        for (let r = 0; r < 8; r++) {
            for (let c = 0; c < 8; c++) {
                const piece = boardState[r][c];
                if (piece && piece === piece.toLowerCase()) {
                    for (let m of getLegalMoves(r, c)) {
                        const target = boardState[m.r][m.col];
                        allCpuMoves.push({from: {r, c}, to: m, score: (target ? pieceValues[target] * 10 : 0) + Math.random()});
                    }
                }
            }
        }
        if (allCpuMoves.length === 0) { endGame('Empate!'); return; }
        allCpuMoves.sort((a, b) => b.score - a.score);
        executeMove(allCpuMoves[0].from.r, allCpuMoves[0].from.c, allCpuMoves[0].to.r, allCpuMoves[0].to.col, false);
    }

    function updateTurnVisuals() {
        if (turn === 'w') {
            statusMsg.textContent = (gameMode === 'online' && myOnlineColor === 'b') ? "Aguardando Brancas (Colega)..." : "Vez das Brancas!";
            statusMsg.style.borderLeftColor = "#27ae60";
            whiteTimerBox.classList.add('white-turn'); blackTimerBox.classList.remove('black-turn');
        } else {
            statusMsg.textContent = gameMode === 'cpu' ? "Máquina pensando..." : ((gameMode === 'online' && myOnlineColor === 'w') ? "Aguardando Pretas (Colega)..." : "Vez das Pretas!");
            statusMsg.style.borderLeftColor = "#e67e22";
            blackTimerBox.classList.add('black-turn'); whiteTimerBox.classList.remove('white-turn');
        }
    }

    function formatTime(seconds) {
        return `${Math.floor(seconds / 60).toString().padStart(2, '0')}:${(seconds % 60).toString().padStart(2, '0')}`;
    }

    function updateClocks() {
        if (!gameActive) return;
        if (turn === 'w') {
            whiteTimeLeft--; whiteTimeEl.textContent = formatTime(whiteTimeLeft);
            if (whiteTimeLeft <= 0) endGame('Tempo esgotado! Pretas venceram.');
        } else {
            blackTimeLeft--; blackTimeEl.textContent = formatTime(blackTimeLeft);
            if (blackTimeLeft <= 0) endGame('Tempo esgotado! Brancas venceram.');
        }
    }

    function endGame(message) {
        gameActive = false; clearInterval(timerInterval); stopBackgroundMusic();
        statusMsg.textContent = `🏁 ${message}`; statusMsg.style.borderLeftColor = "#d63031";
        whiteTimerBox.classList.remove('white-turn'); blackTimerBox.classList.remove('black-turn');
    }

    function startNewGame(notifyPeer = true) {
        initAudio();
        boardState = JSON.parse(JSON.stringify(initialPosition));
        turn = 'w'; selectedSquare = null; validMoves = [];
        gameMode = gameModeSelect.value;

        if (gameMode === 'online') {
            whiteLabel.textContent = myOnlineColor === 'w' ? "Brancas (Você)" : "Brancas (Colega)";
            blackLabel.textContent = myOnlineColor === 'b' ? "Pretas (Você)" : "Pretas (Colega)";
            if (notifyPeer && conn && conn.open) {
                conn.send({ type: 'start', time: timeControlSelect.value });
            }
        } else {
            whiteLabel.textContent = "Brancas (Você)";
            blackLabel.textContent = gameMode === 'cpu' ? "Máquina (CPU)" : "Pretas (Colega)";
        }

        const initialSeconds = parseInt(timeControlSelect.value, 10);
        whiteTimeLeft = initialSeconds; blackTimeLeft = initialSeconds;
        whiteTimeEl.textContent = formatTime(whiteTimeLeft); blackTimeEl.textContent = formatTime(blackTimeLeft);

        gameActive = true;
        updateTurnVisuals(); updateBoardDisplay();
        clearInterval(timerInterval); timerInterval = setInterval(updateClocks, 1000);
        toggleMusicInput.checked ? startBackgroundMusic() : stopBackgroundMusic();
    }

    toggleHintsInput.addEventListener('change', () => { hintsEnabled = toggleHintsInput.checked; updateBoardDisplay(); });
    toggleMusicInput.addEventListener('change', () => { (toggleMusicInput.checked && gameActive) ? startBackgroundMusic() : stopBackgroundMusic(); });
    restartBtn.addEventListener('click', () => startNewGame(true));

    createBoardDOM(); updateBoardDisplay();
</script>
</body>
</html>
